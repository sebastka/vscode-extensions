---
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    versioning-strategy: increase
    groups:
      # Non-major updates are grouped and auto-merged; majors get their own PR for review.
      lint:
        patterns:
          - eslint
          - '@eslint/*'
          - typescript-eslint
          - typescript
          - globals
        update-types: [minor, patch]
    ignore:
      # Must match the minimum VS Code version in `engines.vscode`; bump both by hand.
      - dependency-name: '@types/vscode'
      # Must match the Node.js version shipped with that VS Code version.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']

  - package-ecosystem: pip
    directory: /.github/yamllint
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
