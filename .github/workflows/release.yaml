---
name: Release

# Releases one extension per tag: `<extension>-v<version>`, e.g. `direnv-trusted-v0.1.0`.
'on':
  push:
    tags: ['*-v[0-9]+.[0-9]+.[0-9]+']

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}

jobs:
  ci:
    uses: ./.github/workflows/ci.yaml

  publish:
    needs: ci
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write # GitHub release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Resolve the extension from the tag
        id: extension
        env:
          TAG: ${{ github.ref_name }}
        run: |
          name="${TAG%-v*}"
          version="${TAG##*-v}"
          manifest="extensions/$name/package.json"
          if [ ! -f "$manifest" ]; then
            echo "::error::Tag $TAG does not match any extension in extensions/"
            exit 1
          fi
          actual="$(node -e 'console.log(JSON.parse(fs.readFileSync(process.argv[1], "utf8")).version)' "$manifest")"
          if [ "$actual" != "$version" ]; then
            echo "::error::Tag $TAG does not match version $actual in $manifest"
            exit 1
          fi
          echo "vsix=$RUNNER_TEMP/vsix/$name/$name-$version.vsix" >> "$GITHUB_OUTPUT"

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: vsix
          path: ${{ runner.temp }}/vsix

      # Checked up front, so that a missing token does not leave a release published to only one
      # registry. Trusted publishing (OIDC) is not usable yet: vsce's hidden `--oidc` flag fails
      # the Marketplace token exchange (as of vsce 4.0.0).
      - name: Check the publishing tokens
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          missing=0
          for name in VSCE_PAT OVSX_PAT; do
            if [ -z "${!name}" ]; then
              echo "::error::The $name secret of the release environment is missing or empty"
              missing=1
            fi
          done
          exit "$missing"

      - name: Publish to the VS Marketplace
        env:
          VSIX: ${{ steps.extension.outputs.vsix }}
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx vsce publish --skip-duplicate --packagePath "$VSIX"

      - name: Publish to Open VSX
        env:
          VSIX: ${{ steps.extension.outputs.vsix }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: npx ovsx publish "$VSIX" --skip-duplicate

      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VSIX: ${{ steps.extension.outputs.vsix }}
        run: |
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release upload "$TAG" "$VSIX" --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" "$VSIX" --title "$TAG" --generate-notes --verify-tag --repo "$GITHUB_REPOSITORY"
          fi
